---
version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  groups:
    # Specify a name for the group, which will be used in pull request titles
    # and branch names
    action-bumps:
      applies-to: version-updates # Applies the group rule to version updates
      patterns:
        - "*"       # A wildcard that matches all dependencies in the package
        # ecosystem. Note: using "*" may open a large pull request
        # Define patterns to exclude dependencies from the group (based on
        # dependency name)
        
# Keeps the digest pins in container/Dockerfile current. Without this the
# pins would freeze the base images indefinitely, trading unprovoked cache
# invalidation for missed security updates.
- package-ecosystem: "docker"
  directory: "/container"
  schedule:
    interval: "weekly"
  groups:
    # Specify a name for the group, which will be used in pull request titles
    # and branch names
    docker-bumps:
      applies-to: version-updates # Applies the group rule to version updates
      patterns:
        - "*"       # A wildcard that matches all dependencies in the package
        # ecosystem. Note: using "*" may open a large pull request
        # Define patterns to exclude dependencies from the group (based on
        # dependency name)
  ignore:
    # Digest refreshes are wanted; interpreter version jumps are not. Moving
    # the base image to a new Python is a coordinated change across
    # .python-version, both CI workflows and the venv line in the Dockerfile,
    # so it belongs in a deliberate PR rather than a dependency bump that
    # touches only the FROM lines. PR #137 was exactly that bump, and merging
    # it alone would have produced a 3.14 image running a downloaded 3.12.
    - dependency-name: "python"
      update-types:
        - "version-update:semver-major"
        - "version-update:semver-minor"

- package-ecosystem: "uv"
  directory: "/"
  schedule:
    interval: "weekly"
  groups:
    # Specify a name for the group, which will be used in pull request titles
    # and branch names
    uv-bumps:
      applies-to: version-updates # Applies the group rule to version updates
      patterns:
        - "*"       # A wildcard that matches all dependencies in the package
        # ecosystem. Note: using "*" may open a large pull request
        # Define patterns to exclude dependencies from the group (based on
        # dependency name)
  ignore:
    # amqtt 0.11.x has a packaging bug: different sub-releases pin either
    # pyyaml==6.0.2 or pyyaml==6.0.3, making the constraints unsatisfiable
    # when Dependabot resolves across all Python versions in the >=3.14 range.
    # amqtt is a dev-only MQTT broker dependency; the pinned version in uv.lock
    # is correct and does not need automated updates.
    - dependency-name: amqtt
