name: Build PR image and push to GHCR

# Building a PR image runs the PR's own Dockerfile in a job holding a
# packages:write token, so it is never automatic. A maintainer dispatches it
# explicitly, either from the Actions tab or by commenting /build-pr on the PR
# (see command-build-pr.yaml).
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to build"
        required: true
        type: string

concurrency:
  group: build-pr-${{ inputs.pr }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILD_NAME: Mimirheim
  BUILD_DESCRIPTION: MILP energy optimiser for home battery, PV, and EV scheduling against dynamic electricity prices.
  BUILD_ARCH: amd64, aarch64
  BUILD_VERSION: pr-${{ inputs.pr }}

jobs:
  build-and-push-image:
    name: Build PR image and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read

    steps:
      # Resolves the head commit rather than trusting a caller-supplied SHA, so
      # the image always matches what the PR currently shows.
      - name: Resolve pull request head
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [[ ! "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::'$PR' is not a pull request number"
            exit 1
          fi
          json=$(gh pr view "$PR" --repo "$REPO" \
            --json headRefOid,updatedAt,headRepository,headRepositoryOwner)
          {
            echo "sha=$(jq -r .headRefOid <<<"$json")"
            echo "date=$(jq -r .updatedAt <<<"$json")"
            echo "repo=$(jq -r '.headRepositoryOwner.login + "/" + .headRepository.name' <<<"$json")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.sha }}

      - name: Setup Buildkit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: GHCR Login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=pr-${{ inputs.pr }}
          labels: |
            io.hass.name=${{ env.BUILD_NAME }}
            io.hass.description=${{ env.BUILD_DESCRIPTION }}
            io.hass.arch=${{ env.BUILD_ARCH }}
            io.hass.type=addon
            io.hass.version=${{ env.BUILD_VERSION }}
            org.opencontainers.image.title=${{ env.BUILD_NAME }}
            org.opencontainers.image.description=${{ env.BUILD_DESCRIPTION }}
            org.opencontainers.image.created=${{ steps.pr.outputs.date }}
            org.opencontainers.image.revision=${{ steps.pr.outputs.sha }}
            org.opencontainers.image.source=https://github.com/jsimonetti/mimirheim
            org.opencontainers.image.version=${{ env.BUILD_VERSION }}

      # See build-edge.yaml for why SOURCE_DATE_EPOCH is a fixed constant.
      #
      # This job reads the shared build cache but deliberately does not write to
      # it. Every PR build used to push to the same :buildcache tag that main
      # depends on, so concurrent or cancelled PR builds raced each other and
      # could leave main rebuilding from a cache a PR had just overwritten.
      # Reading only costs nothing and removes that interaction entirely.
      - name: Build and Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          platforms: linux/arm64,linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          outputs: type=image,push=true,rewrite-timestamp=true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          context: .
          file: container/Dockerfile
