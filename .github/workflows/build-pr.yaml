name: Build PR image and push to GHCR

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILD_NAME: Mimirheim
  BUILD_DESCRIPTION: MILP energy optimiser for home battery, PV, and EV scheduling against dynamic electricity prices.
  BUILD_ARCH: amd64, aarch64
  BUILD_VERSION: pr-${{ github.event.pull_request.number }}
  BUILD_DATE: ${{ github.event.pull_request.updated_at }}
  BUILD_REF: ${{ github.event.pull_request.head.sha }}

jobs:
  build-and-push-image:
    name: Build PR image and push to GHCR
    runs-on: ubuntu-latest
    # Skip the build when the PR is closed or merged. The 'closed' event
    # still enters the same concurrency group, which cancels any in-progress
    # run before this condition causes the new run to exit immediately.
    if: github.event.action != 'closed'
    # The 'pr-image' environment has required reviewers configured in
    # GitHub repo Settings → Environments. GitHub pauses this job until
    # a maintainer manually approves the deployment, preventing untrusted
    # PR code from running the build automatically.
    # Setup: Settings → Environments → New environment → "pr-image" →
    #        add required reviewers.
    environment: pr-image
    permissions:
      contents: read
      packages: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Buildkit
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: GHCR Login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}
          labels: |
            io.hass.name="${{ env.BUILD_NAME }}" \
            io.hass.description="${{ env.BUILD_DESCRIPTION }}" \
            io.hass.arch="${{ env.BUILD_ARCH }}" \
            io.hass.type="addon" \
            io.hass.version="${{ env.BUILD_VERSION }}" \
            org.opencontainers.image.title="${{ env.BUILD_NAME }}" \
            org.opencontainers.image.description="${{ env.BUILD_DESCRIPTION }}" \
            org.opencontainers.image.created="${{ env.BUILD_DATE }}" \
            org.opencontainers.image.revision="${{ env.BUILD_REF }}" \
            org.opencontainers.image.source="https://github.com/jsimonetti/mimirheim" \
            org.opencontainers.image.version="${{ env.BUILD_VERSION }}"

      # See build-edge.yaml for why SOURCE_DATE_EPOCH is a fixed constant.
      #
      # This job reads the shared build cache but deliberately does not write to
      # it. Every PR build used to push to the same :buildcache tag that main
      # depends on, so concurrent or cancelled PR builds raced each other and
      # could leave main rebuilding from a cache a PR had just overwritten.
      # Reading only costs nothing and removes that interaction entirely.
      - name: Build and Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          platforms: linux/arm64,linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          outputs: type=image,push=true,rewrite-timestamp=true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          context: .
          file: container/Dockerfile
