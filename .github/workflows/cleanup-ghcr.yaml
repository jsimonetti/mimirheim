name: GHCR Cleanup

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:


jobs:
  ghcr-cleanup-image:
    name: ghcr cleanup actions
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          keep-n-tagged: 20
          exclude-tags: edge,stable,buildcache,pr-*
          keep-n-untagged: 20
          delete-partial-images: true
          delete-ghost-images: true
          delete-orphaned-images: true