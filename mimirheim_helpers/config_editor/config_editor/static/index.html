<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mimirheim config editor</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header>
    <div id="header-left">
      <h1>mimirheim</h1>
      <nav id="mode-bar">
        <button class="mode-btn" id="mode-btn-reports" type="button">Reports</button>
        <button class="mode-btn active" id="mode-btn-config" type="button">Config</button>
      </nav>
    </div>
    <div id="save-bar">
      <span id="save-status"></span>
      <button id="preview-btn" type="button">Preview</button>
      <button id="save-btn" type="button">Save</button>
    </div>
  </header>

  <div id="config-layout">
    <nav id="entry-nav" aria-label="Config entries">
      <!-- Nav rail is built by app.js from GET /api/registry -->
    </nav>

    <main id="entry-content">
      <p id="loading-msg">Loading&hellip;</p>
      <!-- One container per opened entry is mounted here by app.js;
           only the active entry's container is visible at a time. -->
    </main>
  </div>

  <div id="reports-pane">
    <!-- Filled by app.js when switching to reports mode -->
  </div>

  <div id="modal-root">
    <!-- Confirmation dialogs (exclusive-group deletion warning, preview diff) -->
  </div>

  <script src="static/vendor/jedison.1.21.0.umd.js"></script>
  <script src="static/topic-placeholder-editor.js"></script>
  <script src="static/app.js"></script>
</body>
</html>
