{% import "_theme_toggle.html" as theme_toggle %}
<!DOCTYPE html>
<html lang="en"{% if theme %} data-bs-theme="{{ theme }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mimirheim Config Editor</title>
  <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="/static/theme.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="navbar-brand mb-0 h1">Mimirheim Config Editor</span>
      {{ theme_toggle.render(theme, current_path) }}
    </div>
  </nav>
  <main class="container pb-5">
    <h1 class="h3 mb-3">Config Owners</h1>
    {% if owners %}
    <div class="list-group" id="owner-list">
      {% for owner in owners %}
      <a href="/owners/{{ owner.owner_id }}" class="list-group-item list-group-item-action">{{ owner.display_name }}</a>
      {% endfor %}
    </div>
    {% else %}
    <p class="text-muted">No Config Owners discovered yet.</p>
    {% endif %}
  </main>
</body>
</html>
