# Sample mimirheim configuration with two named batteries, used by the
# ticket 08 nested Named Collection edit end-to-end test.
mqtt:
  host: localhost  # broker address
  port: 1883
grid:
  import_limit_kw: 10.0  # DNO connection agreement
  export_limit_kw: 5.0
batteries:
  battery_main:
    capacity_kwh: 5.4  # usable capacity
    min_soc_kwh: 0.5
    charge_segments:
      - power_max_kw: 2.5
        efficiency: 0.95
    discharge_segments:
      - power_max_kw: 2.5
        efficiency: 0.95
  battery_sos2_example:
    capacity_kwh: 10.0  # usable capacity
    min_soc_kwh: 0.5
    charge_segments:
      - power_max_kw: 3.0
        efficiency: 0.9
    discharge_segments:
      - power_max_kw: 3.0
        efficiency: 0.9
