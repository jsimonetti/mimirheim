[project]
name = "mimirheim"
version = "0.1.10"
requires-python = ">=3.14"
dependencies = [
    "mip>=1.14",
    "pydantic>=2.13.4",
    "paho-mqtt>=2.0",
    "pyyaml>=6.0.3",
]

# ---------------------------------------------------------------------------
# Optional extras — install only the helpers you need.
#
# Core install (solver only, no helper deps):
#   pip install mimirheim
#
# With specific helpers:
#   pip install "mimirheim[nordpool,pv-fetcher,reporter]"
#
# Everything (all helpers):
#   pip install "mimirheim[helpers]"
# ---------------------------------------------------------------------------
[project.optional-dependencies]
scheduler = [
    "apscheduler>=3.11.3,<4.0",
]
nordpool = [
    "pynordpool>=0.4.0",
]
zonneplan = [
    "requests>=2.34.2",
]
pv-fetcher = [
    "forecast-solar>=5.0.1",
]
pv-ml-learner = [
    "httpx>=0.27",
    "knmi-py>=0.2",
    "sqlalchemy>=2.0.52",
    "xgboost>=3.4.1",
    "scikit-learn>=1.9.0",
    "joblib>=1.6.0",
    "pandas>=3.0.5",
]
pv-ml-learner-postgres = [
    "psycopg2-binary>=2.9.12",
]
pv-ml-learner-mysql = [
    "pymysql>=1.2.0",
]
baseload-ha = [
    "httpx>=0.27",
]
baseload-ha-db = [
    "sqlalchemy>=2.0.52",
]
baseload-ha-db-postgres = [
    "psycopg2-binary>=2.9.12",
]
baseload-ha-db-mysql = [
    "pymysql>=1.2.0",
]
reporter = [
    "plotly>=7.0.0",
]
config-editor = [
    "ruamel.yaml>=0.18",
]
# Meta-extra: installs every helper's runtime dependencies in one shot.
# Used by the container build and by full developer environments.
helpers = [
    "apscheduler>=3.11.3,<4.0",
    "pynordpool>=0.4.0",
    "requests>=2.34.2",
    "forecast-solar>=5.0.1",
    "httpx>=0.27",
    "knmi-py>=0.2",
    "sqlalchemy>=2.0.52",
    "xgboost>=3.4.1",
    "scikit-learn>=1.9.0",
    "joblib>=1.6.0",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
]

# All module packages live in the single mimirheim wheel.
# helper_common and every helper tool module are included here so that
# the wheel remains self-contained; the extras above gate which third-party
# deps are installed, not which modules are present.
[tool.hatch.build.targets.wheel]
packages = [
    "mimirheim",
    "mimirheim_helpers/common/helper_common",
    "mimirheim_helpers/scheduler/scheduler",
    "mimirheim_helpers/prices/nordpool/nordpool",
    "mimirheim_helpers/prices/zonneplan/zonneplan_prices",
    "mimirheim_helpers/pv/forecast.solar/pv_fetcher",
    "mimirheim_helpers/pv/pv_ml_learner/pv_ml_learner",
    "mimirheim_helpers/baseload/homeassistant/baseload_ha",
    "mimirheim_helpers/baseload/homeassistant_db/baseload_ha_db",
    "mimirheim_helpers/baseload/static/baseload_static",
    "mimirheim_helpers/reporter/reporter",
    "mimirheim_helpers/config_editor/config_editor",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.3.0",
    "amqtt>=0.11",
    "plotly>=7.0.0",
    "freezegun>=1.4",
    # Was also a core runtime dependency until it was recognised as test-only.
    # The floor stays at the version core pinned so the lock does not regress.
    "respx>=0.23.1",
    "jinja2>=3.0",
]

[tool.ruff]
# Tracks `requires-python` above, which is also what the container runs. Keep
# the two in step: ruff must not suggest syntax the supported interpreter
# cannot execute.
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Deliberately narrow. These four families catch real defects rather than
# style preferences, and the tree is clean under them, so the CI gate is
# meaningful from the first commit rather than a wall of pre-existing noise.
#
#   F   pyflakes: undefined names, unused imports, dead local variables.
#   E9  syntax and IO errors only. The rest of pycodestyle is formatting and
#       is left out on purpose; this project does not run a formatter.
#   B   bugbear: mutable default arguments, zip() without strict, except
#       clauses that swallow the original error.
#
# RUF100 (unused noqa directives) is deliberately absent. With a narrow select
# list most existing `# noqa` comments name rules that are not enabled, and
# they are worth keeping: `# noqa: S307` on a deliberate eval documents the
# decision whether or not the security rules run today.
#
# Widen this list only together with the work to make the tree pass it.
select = ["F", "E9", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration' --import-mode=importlib"
testpaths = [
    "tests",
    "mimirheim_helpers/common/tests",
    "mimirheim_helpers/scheduler/tests",
    "mimirheim_helpers/prices/nordpool/tests",
    "mimirheim_helpers/prices/zonneplan/tests",
    "mimirheim_helpers/pv/forecast.solar/tests",
    "mimirheim_helpers/pv/pv_ml_learner/tests",
    "mimirheim_helpers/baseload/homeassistant/tests",
    "mimirheim_helpers/baseload/homeassistant_db/tests",
    "mimirheim_helpers/baseload/static/tests",
    "mimirheim_helpers/reporter/tests",
    "mimirheim_helpers/config_editor/tests",
]
markers = [
    "integration: marks tests that require a live MQTT broker (run with -m integration)",
    "benchmark: marks performance benchmark tests (measured by pytest-benchmark, never fail on timing)",
]
filterwarnings = [
    # passlib 1.7.4 (pulled in by amqtt) imports the deprecated 'crypt' module.
    # passlib is unmaintained; the warning originates in third-party code and
    # cannot be fixed here. Suppress it to keep test output clean.
    "ignore:'crypt' is deprecated:DeprecationWarning:passlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
